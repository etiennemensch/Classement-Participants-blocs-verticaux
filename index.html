<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPECHECS - Classement Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: flex-start;
      align-items: flex-start;
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .widget-container {
      width: 330px;
      height: 100vh;
      background-color: #1e1a17;
      border-right: 2px solid #2a2420;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 4px 0 20px rgba(0,0,0,0.5);
    }

    /* En-tête avec bouton Config séparé à GAUCHE */
    .header-banner {
      background: linear-gradient(135deg, #d35400, #e67e22);
      padding: 12px 14px;
      border-radius: 0 0 16px 16px;
      position: relative;
    }

    .header-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .header-logo-title {
      font-size: 19px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
    }

    .live-badge {
      background-color: #e74c3c;
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 10px;
      text-transform: uppercase;
      pointer-events: none;
    }

    .header-subtitle {
      font-size: 11px;
      font-weight: 800;
      color: #f39c12;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-indicator {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      color: #ffffff;
    }

    /* Bouton d'action sous le bandeau orange */
    .action-bar {
      padding: 6px 12px;
      background: #181512;
      font-size: 10px;
      color: #888;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2420;
    }

    .btn-cfg {
      background: #34495e;
      color: white;
      border: none;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-cfg:hover { background: #2c3e50; }

    /* Panneau de Configuration */
    .config-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #181512;
      z-index: 99999;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .config-panel.hidden { display: none !important; }

    .config-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .config-group label {
      font-size: 11px;
      color: #aaa;
    }

    .config-group textarea {
      background: #2a2a2a;
      border: 1px solid #444;
      color: white;
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      height: 120px;
      font-family: monospace;
    }

    .btn-action {
      background: #e67e22;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
    }

    /* Liste Joueurs */
    .player-list-container {
      flex: 1;
      padding: 10px;
      overflow: hidden;
    }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity 0.3s ease;
    }

    .player-list.fade-out { opacity: 0; }

    .player-card {
      background: #25201c;
      border-left: 3px solid #e67e22;
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .player-rank {
      font-size: 11px;
      font-weight: 800;
      color: #e67e22;
      min-width: 24px;
      text-align: center;
    }

    .flag-icon {
      width: 20px;
      height: 14px;
      object-fit: cover;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .player-details {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .player-name-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .title-badge {
      font-size: 9px;
      font-weight: 800;
      padding: 1px 4px;
      border-radius: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .title-g { background: #f1c40f; color: #000; }
    .title-m { background: #e67e22; color: #fff; }
    .title-f { background: #3498db; color: #fff; }

    .player-name {
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-sub {
      font-size: 9px;
