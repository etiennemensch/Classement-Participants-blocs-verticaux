<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPECHECS - Classement Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, sans-serif;
    }

    /* J'ai ajouté un justify-content: center pour que le widget soit visible au milieu de l'écran lors des tests */
    body {
      background-color: #121212;
      background-image: radial-gradient(circle, #2a2a2a 1px, transparent 1px);
      background-size: 20px 20px; /* Petit motif pour montrer que la page n'est pas "morte" */
      color: #ffffff;
      display: flex;
      justify-content: center; 
      align-items: center;
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .widget-container {
      width: 330px;
      height: 100vh;
      background-color: #1e1a17;
      border-right: 2px solid #2a2420;
      border-left: 2px solid #2a2420;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }

    .header-banner {
      background: linear-gradient(135deg, #d35400, #e67e22);
      padding: 14px;
      border-radius: 0 0 16px 16px;
      position: relative;
    }

    .header-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      padding-right: 32px;
    }

    .header-logo-title {
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
    }

    .live-badge {
      background-color: #e74c3c;
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 10px;
      text-transform: uppercase;
    }

    .header-subtitle {
      font-size: 12px;
      font-weight: 800;
      color: #f39c12;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-indicator {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      color: #ffffff;
    }

    .controls-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }
