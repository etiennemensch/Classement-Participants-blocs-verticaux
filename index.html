<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPECHECS - Classement Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', -apple-system, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .app-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 330px;
      height: 100vh;
      background-color: #1e1a17;
      border-right: 2px solid #2a2420;
      display: flex;
      flex-direction: column;
      box-shadow: 4px 0 20px rgba(0,0,0,0.5);
      z-index: 10;
    }

    .app-header {
      background: linear-gradient(135deg, #d35400, #e67e22);
      padding: 14px;
      border-radius: 0 0 16px 16px;
      position: relative;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
      padding-right: 32px;
    }

    .logo-title {
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
    }

    .live-badge {
      background-color: #e74c3c;
      color: white;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 10px;
      text-transform: uppercase;
    }

    .sub-title {
      font-size: 12px;
      font-weight: 800;
      color: #f39c12;
      text-transform: uppercase;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-indicator {
      background: rgba(0, 0, 0, 0.3);
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      color: #ffffff;
    }

    .controls-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
    }

    .ctrl-btn {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: white;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .ctrl-btn:hover {
      background: rgba(0, 0, 0, 0.5);
    }

    .settings-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      z-index: 1000;
    }

    .settings-btn:hover {
      background: rgba(0, 0, 0, 0.8);
    }

    .settings-panel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(18, 18, 18, 0.98);
      z-index: 9999;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .settings-panel.hidden { display: none; }

    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .settings-group label {
      font-size: 11px;
      color: #aaa;
    }

    .settings-group textarea {
      background: #2a2a2a;
      border: 1px solid #444;
      color: white;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      height: 120px;
      font-family: monospace;
    }

    .btn-action {
      background: #e67e22;
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
      text-transform: uppercase;
    }

    .info-bar {
      padding: 6px 12px;
      background: #181512;
      font-size: 10px;
      color: #888;
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #2a2420;
    }

    .player-list-container {
      flex: 1;
      padding: 10px;
      overflow: hidden;
    }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: opacity 0.3s ease;
    }

    .player-list.fade-out { opacity: 0; }

    .player-card {
      background: #25201c;
      border-left: 3px solid #e67e22;
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .player-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .player-rank {
      font-size: 11px;
      font-weight: 800;
      color: #e67e22;
      min-width: 22px;
      text-align: center;
    }

    .flag-icon {
      width: 20px;
      height: 14px;
      object-fit: cover;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .player-details {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .player-name-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

      font-size: 9px;
